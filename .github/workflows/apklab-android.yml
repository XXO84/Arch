name: APKLab Android Runtime

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Optional direct APK URL. Leave empty to build and test the bundled smoke APK.'
        required: false
        default: ''
  push:
    branches: [ main, apklab-modewidget-a53-build ]
    paths:
      - '.github/workflows/apklab-android.yml'
      - 'apklab/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/apklab-android.yml'
      - 'apklab/**'

permissions:
  contents: read

concurrency:
  group: apklab-android-runtime-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'
  ANDROID_API: '34'
  ANDROID_ARCH: 'x86_64'
  ANDROID_TAG: 'aosp_atd'

jobs:
  android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          test -e /dev/kvm
          ls -la /dev/kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install emulator host libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          ldconfig -p | grep 'libpulse.so.0'

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'emulator' \
            'platforms;android-34' \
            'build-tools;36.0.0' \
            'system-images;android-34;aosp_atd;x86_64'
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/emulator/emulator" -version
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
          adb version
          ldd "$ANDROID_HOME/emulator/emulator" > emulator-launcher-ldd.txt 2>&1 || true

      - name: Create AVD
        shell: bash
        run: |
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo 'no' | avdmanager create avd \
            --force \
            --name apklab_api34 \
            --package 'system-images;android-34;aosp_atd;x86_64' \
            --device 'pixel_2'
          avdmanager list avd
          test -f "$ANDROID_AVD_HOME/apklab_api34.ini"
          test -d "$ANDROID_AVD_HOME/apklab_api34.avd"

      - name: Start emulator
        shell: bash
        run: |
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          nohup "$ANDROID_HOME/emulator/emulator" @apklab_api34 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -memory 2048 \
            -partition-size 2048 \
            -gpu swiftshader_indirect \
            -accel on \
            -verbose \
            > emulator.log 2>&1 &
          echo $! > emulator.pid
          sleep 5
          if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then
            echo 'Emulator process exited during startup.'
            cat emulator.log || true
            exit 1
          fi
          ps -fp "$(cat emulator.pid)" || true

      - name: Wait for Android
        shell: bash
        run: |
          if ! timeout 150 adb wait-for-device; then
            echo 'ADB device timeout.'
            adb devices -l || true
            ps aux | grep -E '[e]mulator|[q]emu' || true
            cat emulator.log || true
            exit 1
          fi
          for i in $(seq 1 120); do
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            ANIM="$(adb shell getprop init.svc.bootanim 2>/dev/null | tr -d '\r')"
            echo "boot[$i]: sys.boot_completed=$BOOT bootanim=$ANIM"
            if [ "$BOOT" = '1' ]; then
              echo 'Android boot completed.'
              adb shell input keyevent 82 || true
              adb shell getprop ro.build.version.release
              adb shell getprop ro.build.version.sdk
              exit 0
            fi
            sleep 2
          done
          echo 'Android sys.boot_completed timeout.'
          adb devices -l || true
          adb shell getprop || true
          cat emulator.log || true
          exit 1

      - name: Run APKLab runtime test
        shell: bash
        run: |
          chmod +x apklab/run-runtime-test.sh
          apklab/run-runtime-test.sh '${{ github.event.inputs.apk_url }}'

      - name: Upload APKLab report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apklab-android-runtime-${{ github.run_id }}
          path: |
            apklab/reports/**
            emulator.log
            emulator-launcher-ldd.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Stop emulator
        if: always()
        run: adb emu kill || true
