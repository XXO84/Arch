name: APKLab Android Runtime

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Optional direct APK URL. Leave empty to build and test the bundled smoke APK.'
        required: false
        default: ''
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apklab-android.yml'
      - 'apklab/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/apklab-android.yml'
      - 'apklab/**'

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  ANDROID_API: '28'
  ANDROID_ARCH: 'x86'

jobs:
  android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'emulator' \
            'platforms;android-28' \
            'build-tools;28.0.3' \
            'system-images;android-28;default;x86'

      - name: Create AVD
        shell: bash
        run: |
          echo 'no' | avdmanager create avd \
            --force \
            --name apklab_api28 \
            --package 'system-images;android-28;default;x86' \
            --device 'pixel_2'
          avdmanager list avd

      - name: Start emulator
        shell: bash
        run: |
          nohup emulator @apklab_api28 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -memory 1536 \
            -partition-size 2048 \
            -gpu swiftshader_indirect \
            -accel auto \
            > emulator.log 2>&1 &
          echo $! > emulator.pid

      - name: Wait for Android
        shell: bash
        run: |
          adb wait-for-device
          for i in $(seq 1 180); do
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$BOOT" = '1' ]; then
              echo 'Android boot completed.'
              adb shell input keyevent 82 || true
              exit 0
            fi
            sleep 2
          done
          echo 'Android boot timeout.'
          cat emulator.log || true
          exit 1

      - name: Run APKLab runtime test
        shell: bash
        run: |
          chmod +x apklab/run-runtime-test.sh
          apklab/run-runtime-test.sh '${{ github.event.inputs.apk_url }}'

      - name: Upload APKLab report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apklab-android-runtime-${{ github.run_id }}
          path: |
            apklab/reports/**
            emulator.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop emulator
        if: always()
        run: adb emu kill || true
