name: Build Crimson Desert Absolute Survival

on:
  push:
    branches:
      - codex/crimson-absolute-survival
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Fetch pinned Trinity MIT source
        shell: pwsh
        run: |
          git clone https://github.com/XeTrinityz/Trinity.git TrinitySrc
          git -C TrinitySrc checkout 70c9a00dd6e10b2081d706a837756844c11f5c2b
          $head = (git -C TrinitySrc rev-parse HEAD).Trim()
          if ($head -ne '70c9a00dd6e10b2081d706a837756844c11f5c2b') { throw 'Pinned Trinity commit mismatch' }

      - name: Apply Absolute Survival patch
        shell: pwsh
        run: |
          Copy-Item crimson-absolute-survival/absolute_survival_main.cpp TrinitySrc/src/absolute_survival_main.cpp -Force
          Copy-Item crimson-absolute-survival/CMakeLists.txt TrinitySrc/CMakeLists.txt -Force
          & ./crimson-absolute-survival/patch_upstream.ps1

      - name: Configure x64 Release
        shell: pwsh
        run: cmake -S TrinitySrc -B TrinitySrc/build -G "Visual Studio 17 2022" -A x64

      - name: Build x64 Release
        shell: pwsh
        run: cmake --build TrinitySrc/build --config Release --parallel

      - name: Validate PE and package
        shell: pwsh
        run: |
          $asi = 'TrinitySrc/build/Release/CrimsonDesert_AbsoluteSurvival.asi'
          if (-not (Test-Path -LiteralPath $asi -PathType Leaf)) { throw 'ASI output missing' }
          $bytes = [IO.File]::ReadAllBytes($asi)
          if ($bytes.Length -lt 4096) { throw 'ASI output unexpectedly small' }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'ASI is not a PE/MZ image' }

          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item $asi package/
          Copy-Item TrinitySrc/LICENSE package/LICENSE_Trinity_MIT.txt
          Copy-Item crimson-absolute-survival/README_DE.txt package/README_DE.txt
          $hash = (Get-FileHash $asi -Algorithm SHA256).Hash
          "CrimsonDesert_AbsoluteSurvival.asi SHA256=$hash" | Set-Content package/SHA256.txt -Encoding ascii
          Compress-Archive -Path package/* -DestinationPath CrimsonDesert_AbsoluteSurvival_v1.0.0.zip -Force
          Write-Host "ASI SHA256: $hash"

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: CrimsonDesert_AbsoluteSurvival_v1.0.0
          path: CrimsonDesert_AbsoluteSurvival_v1.0.0.zip
          if-no-files-found: error
          retention-days: 7
