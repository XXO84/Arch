name: Build Crimson Desert Absolute Survival

on:
  push:
    branches:
      - codex/crimson-absolute-survival
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Fetch pinned Trinity MIT source
        shell: pwsh
        run: |
          git clone https://github.com/XeTrinityz/Trinity.git TrinitySrc
          git -C TrinitySrc checkout 70c9a00dd6e10b2081d706a837756844c11f5c2b
          $head = (git -C TrinitySrc rev-parse HEAD).Trim()
          if ($head -ne '70c9a00dd6e10b2081d706a837756844c11f5c2b') { throw 'Pinned Trinity commit mismatch' }

      - name: Apply Absolute Survival source
        shell: pwsh
        run: |
          Copy-Item crimson-absolute-survival/absolute_survival_main.cpp TrinitySrc/src/absolute_survival_main.cpp -Force
          Copy-Item crimson-absolute-survival/durability_guard.cpp TrinitySrc/src/durability_guard.cpp -Force
          Copy-Item crimson-absolute-survival/durability_guard.h TrinitySrc/src/durability_guard.h -Force
          Copy-Item crimson-absolute-survival/CMakeLists.txt TrinitySrc/CMakeLists.txt -Force
          & ./crimson-absolute-survival/patch_upstream.ps1

      - name: Configure x64 Release
        shell: pwsh
        run: cmake -S TrinitySrc -B TrinitySrc/build -G "Visual Studio 17 2022" -A x64 -DSAFETYHOOK_FETCH_ZYDIS=ON

      - name: Build x64 Release
        shell: pwsh
        run: cmake --build TrinitySrc/build --config Release --parallel

      - name: Validate PE and package
        shell: pwsh
        run: |
          $asi = 'TrinitySrc/build/Release/CrimsonDesert_AbsoluteSurvival.asi'
          if (-not (Test-Path -LiteralPath $asi -PathType Leaf)) { throw 'ASI output missing' }
          $bytes = [IO.File]::ReadAllBytes($asi)
          if ($bytes.Length -lt 4096) { throw 'ASI output unexpectedly small' }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'ASI is not a PE/MZ image' }

          $lfanew = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($lfanew -lt 0 -or $lfanew + 6 -ge $bytes.Length) { throw 'Invalid PE header offset' }
          if ($bytes[$lfanew] -ne 0x50 -or $bytes[$lfanew+1] -ne 0x45 -or $bytes[$lfanew+2] -ne 0 -or $bytes[$lfanew+3] -ne 0) { throw 'Invalid PE signature' }
          $machine = [BitConverter]::ToUInt16($bytes, $lfanew + 4)
          if ($machine -ne 0x8664) { throw ('Wrong architecture: 0x{0:X4}' -f $machine) }

          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item $asi package/
          Copy-Item TrinitySrc/LICENSE package/LICENSE_Trinity_MIT.txt
          $safetyLicense = 'TrinitySrc/build/_deps/safetyhook-src/LICENSE'
          if (Test-Path -LiteralPath $safetyLicense) { Copy-Item $safetyLicense package/LICENSE_SafetyHook_BSL1.txt }
          Copy-Item crimson-absolute-survival/README_DE.txt package/README_DE.txt

          $hash = (Get-FileHash $asi -Algorithm SHA256).Hash
          "CrimsonDesert_AbsoluteSurvival.asi SHA256=$hash" | Set-Content package/SHA256.txt -Encoding ascii
          Compress-Archive -Path package/* -DestinationPath CrimsonDesert_AbsoluteSurvival_v1.1.0.zip -Force
          Write-Host "ASI SHA256: $hash"
          Write-Host "ASI size: $($bytes.Length)"
          Write-Host ('PE Machine: 0x{0:X4}' -f $machine)

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: CrimsonDesert_AbsoluteSurvival_v1.1.0
          path: CrimsonDesert_AbsoluteSurvival_v1.1.0.zip
          if-no-files-found: error
          retention-days: 7
