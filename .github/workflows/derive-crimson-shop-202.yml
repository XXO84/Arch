name: Derive Crimson Tavern 2.02

on:
  push:
    branches:
      - codex/crimson-shop-202
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Clone current references
        run: |
          git clone --depth 1 https://github.com/faisalkindi/CrimsonDesert-UltimateModsManager.git cdumm
          git clone --depth 1 https://github.com/exodiaprivate-eng/dmm-parser.git dmm-parser
      - name: Prepare September store fixture
        shell: bash
        run: |
          python - <<'PY'
          import zlib
          from pathlib import Path
          src=Path('cdumm/tests/fixtures/vanilla_b25116796')
          out=Path('fixture'); out.mkdir()
          for n in ('storeinfo.pabgb','storeinfo.pabgh'):
              (out/n).write_bytes(zlib.decompress((src/(n+'.zlib')).read_bytes()))
          PY
      - name: Dump complete Hernand Tavern records via current DMM parser
        shell: bash
        run: |
          mkdir -p dmm-parser/examples
          cat > dmm-parser/examples/dump_tavern_202.rs <<'RS'
          use std::{fs, env};
          fn main() {
              let root=env::args().nth(1).expect("fixture path");
              let b=fs::read(format!("{}/storeinfo.pabgb",root)).unwrap();
              let h=fs::read(format!("{}/storeinfo.pabgh",root)).unwrap();
              let rows=dmm_parser::dispatch::parse_table_to_json("storeinfo.pabgb", &b, Some(&h)).unwrap();
              let mut hits=0;
              for row in rows {
                  let o=row.as_object().unwrap();
                  let key=o.get("key").and_then(|v|v.as_u64()).unwrap_or(0);
                  let name=o.get("string_key").and_then(|v|v.as_str()).unwrap_or("");
                  if key==401 || name=="Store_Her_Tavern" {
                      hits+=1;
                      println!("TAVERN_FULL_JSON={}", serde_json::to_string(&row).unwrap());
                      let list=o.get("stock_data_list").and_then(|v|v.as_array()).unwrap();
                      println!("TAVERN_COUNT={}",list.len());
                      for i in 7usize..18usize {
                          println!("TAVERN_SLOT_{}_JSON={}",i+1,serde_json::to_string(&list[i]).unwrap());
                      }
                  }
              }
              assert_eq!(hits,1,"expected one Hernand Tavern");
          }
          RS
          (cd dmm-parser && cargo run --release --example dump_tavern_202 -- ../fixture)
